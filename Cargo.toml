[workspace]
members = [
    "crates/busybar",
    "crates/busybar-render",
    "crates/busylib",
    "crates/busylib-proto",
    "crates/busylib-proto-build",
    "crates/bookdoc",
]
default-members = ["crates/busybar"]
resolver = "3"

[workspace.package]
version = "0.0.8"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
license = "Apache-2.0 OR MIT"
edition = "2024"
repository = "https://github.com/foresterre/busybar-rust"
readme = "README.md"

[workspace.dependencies]
# this workspace
busybar-render = { path = "crates/busybar-render", version = "0.0.8" }
busylib = { path = "crates/busylib", version = "0.0.8" }
busylib-proto = { path = "crates/busylib-proto", version = "0.0.8" }

# external
base64 = "0.23.0"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
futures-util = { version = "0.3", default-features = false, features = [
    "std",
    "sink",
] }
http = "1"
prost = "0.14.4"
prost-build = { version = "0.14.4", default-features = false, features = ["format"] }
protox = "0.9.1"
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "jpeg",
    "png",
] }
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1"
storyteller = "2.0.0-beta.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "handshake",
] }
url = "2.5"
wiremock = "0.6"
